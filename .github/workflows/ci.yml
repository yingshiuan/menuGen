name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push makes an in-flight run obsolete; don't pay for it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # puppeteer sits in both workspaces' dependencies, but nothing in CI drives a
  # browser. Skipping the Chrome download saves ~150MB and a minute per install.
  PUPPETEER_SKIP_DOWNLOAD: 'true'

jobs:
  frontend:
    name: frontend (type-check, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Separate steps rather than `npm run build` (which runs type-check and
      # build-only in parallel) so a red run names which one broke.
      - run: npm run type-check

      - run: npm run test:unit:run -- --coverage

      - run: npm run build-only

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 7

  lint:
    name: lint & format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # `if: always()` on the later steps so one failure doesn't hide the rest.
      - run: npm run check:lint:oxlint

      - run: npm run check:lint:eslint
        if: always()

      - run: npm run check:format
        if: always()

  pdf-stylesheet:
    # The backend styles PDFs with frontend/public/css/tailwind.css, a committed build of
    # the app's CSS (the backend has no Vite). The dev server rebuilds it on every save;
    # this job is the safety net for a copy that was never rebuilt or never committed.
    # On main it commits the rebuilt file, so the backend never renders with old styles.
    # On a pull request it only warns: main fixes it right after the merge.
    name: PDF stylesheet (frontend/public/css/tailwind.css)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run build:css

      - name: Commit it on main, warn on a pull request
        run: |
          if git diff --quiet -- public/css/tailwind.css; then
            echo "The PDF stylesheet is up to date."
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF" = refs/heads/main ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore: rebuild the PDF stylesheet' -- public/css/tailwind.css
            # A push made with GITHUB_TOKEN starts no new workflow run, so this can't loop
            git push origin HEAD:main
          else
            echo "::warning file=frontend/public/css/tailwind.css::The PDF stylesheet is out of date with the frontend sources. It is rebuilt and committed on main after this merges, or run 'npm run build:css' in frontend/ and commit it now."
          fi

  backend:
    name: backend (test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # --ignore-scripts skips the postinstall Chrome download. Installing at
      # all is still worth it: it proves the lockfile resolves. devDependencies
      # still install, and vitest needs no install script of its own.
      - run: npm ci --ignore-scripts

      - run: npm run test:unit:run -- --coverage

      # Still worth keeping alongside the suite: it is the only thing that reads
      # files no test imports, including the untracked scratch routes.
      - run: git ls-files '*.js' | xargs -n1 node --check

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  docker:
    name: backend (docker build, smoke render)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      # The other backend job installs from the lockfile on the runner, so it
      # never touches the Dockerfile. That is how a base image going EOL got
      # through: apt-get update still succeeded while every .deb 404'd, and
      # nothing in CI built the image to notice.
      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          load: true
          tags: menu-gen-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Building proves the image resolves; it does not prove Chromium can
      # actually start. Rendering one small PDF covers the rest of the path --
      # browser launch, sharp, and the webfont wait.
      - name: Boot the container
        run: |
          docker run -d --name backend-ci -p 3000:3000 \
            -e CHROMIUM_PATH=/usr/bin/chromium \
            menu-gen-backend:ci
          for i in $(seq 1 30); do
            if curl -sf -m 5 http://localhost:3000/ping >/dev/null; then
              echo "backend up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "backend never answered /ping"; exit 1

      - name: Smoke render a PDF
        run: |
          IMG='data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg=='
          JOB=$(curl -sf -m 30 -X POST http://localhost:3000/generate-pdf \
            -H 'Content-Type: application/json' \
            -d "{\"html\":\"<div><h1>CI</h1><img src='$IMG' /></div>\",\"font\":\"Inter\"}" \
            | node -e 'let b="";process.stdin.on("data",d=>b+=d).on("end",()=>console.log(JSON.parse(b).jobId))')
          test -n "$JOB" || { echo "no jobId returned"; exit 1; }

          for i in $(seq 1 90); do
            CODE=$(curl -s -o /tmp/out -w '%{http_code}' -m 30 "http://localhost:3000/job/$JOB")
            case "$CODE" in
              200)
                # A PDF starts with %PDF; a status reply is JSON.
                if head -c 4 /tmp/out | grep -q '%PDF'; then
                  echo "rendered $(wc -c < /tmp/out) bytes in ${i}s"; exit 0
                fi
                ;;
              *) echo "job failed: HTTP $CODE"; cat /tmp/out; exit 1 ;;
            esac
            sleep 1
          done
          echo "render timed out"; exit 1

      - name: Backend logs
        if: always()
        run: docker logs backend-ci 2>&1 || true
